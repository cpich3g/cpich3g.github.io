<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Justin Joy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap not-found">
    <h1>Wrong turn.<br><em>Route recalculating.</em></h1>
    <p>This page isn’t on the map. Head back to the portfolio to see projects and experience.</p>
    <div class="actions"><a class="button primary" href="/">Back to the route</a></div>
  </main>
</body>
</html>
